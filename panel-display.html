<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital LED Vesak Pandol – Background Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* white make transparent -> making background dark or transparent */
            background: transparent;
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        .canvas-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        #led-canvas {
            display: block;
            background: transparent; /* transparent backarea */
        }

        /* ── Controls bar ─────────────────────────── */
        .controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            padding: 9px 16px 11px;
            background: rgba(0, 5, 12, 0.88);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(0, 200, 80, 0.15);
        }

        .ctrl-btn {
            background: rgba(0, 60, 20, 0.3);
            border: 1px solid rgba(0, 180, 70, 0.35);
            color: #00dd60;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.18s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            user-select: none;
        }

        .ctrl-btn:hover {
            background: rgba(0, 120, 40, 0.4);
            border-color: #00ee70;
            color: #88ffaa;
        }

        .ctrl-btn.active {
            background: rgba(0, 150, 55, 0.45);
            border-color: #00ff80;
            color: #88ffaa;
        }
        
        .ctrl-divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0 3px;
        }

        .ctrl-label {
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="canvas-wrap">
        <canvas id="led-canvas"></canvas>
    </div>

    <nav class="controls-bar">
        <span class="ctrl-label">Pattern</span>
        <button class="ctrl-btn active" data-pat="0" onclick="setPattern(0,this)">Wave</button>
        <button class="ctrl-btn" data-pat="1" onclick="setPattern(1,this)">Chase</button>
        <button class="ctrl-btn" data-pat="2" onclick="setPattern(2,this)">Pulse</button>
        <button class="ctrl-btn" data-pat="3" onclick="setPattern(3,this)">Rainbow</button>
        <div class="ctrl-divider"></div>
        <span class="ctrl-label">Speed</span>
        <button class="ctrl-btn" id="btn-speed" onclick="cycleSpeed()">⏩ <span id="spd-lbl">1×</span></button>
        <div class="ctrl-divider"></div>
        <a href="index.html" class="ctrl-btn" style="border-color: gold; color: gold;">← Main Thoran</a>
    </nav>

    <script>
        (() => {
            const canvas = document.getElementById('led-canvas');
            const ctx = canvas.getContext('2d');

            let frame = 0;
            let pattern = 0;
            let speedIdx = 1;
            const SPEEDS = [0.5, 1, 1.5, 2.5];
            const SPEED_LABELS = ['0.5×', '1×', '1.5×', '2.5×'];

            const leds = [];
            let LW, LH, CX, CY;

            function initLayout() {
                LW = window.innerWidth;
                LH = window.innerHeight - 50;
                canvas.width = LW;
                canvas.height = LH;
                CX = LW / 2;
                CY = LH / 2;
                generateLeds();
            }

            function generateLeds() {
                leds.length = 0;
                
                // We want concentric 8-pointed star rings
                const numRings = 15;
                const baseSize = Math.min(LW, LH) * 0.45;
                const ringSpacing = baseSize / numRings;
                
                for(let ring = 1; ring <= numRings; ring++) {
                    const R = ring * ringSpacing; // Outer radius (tips)
                    const r_inner = R * Math.sqrt(2 - Math.SQRT2); // Inner corner radius
                    
                    // The perimeter is 16 segments
                    for(let seg = 0; seg < 16; seg++) {
                        const angle1 = seg * Math.PI / 8;
                        const angle2 = (seg + 1) * Math.PI / 8;
                        
                        const r1 = (seg % 2 === 0) ? R : r_inner;
                        const r2 = (seg % 2 === 0) ? r_inner : R;
                        
                        const x1 = Math.cos(angle1) * r1;
                        const y1 = Math.sin(angle1) * r1;
                        const x2 = Math.cos(angle2) * r2;
                        const y2 = Math.sin(angle2) * r2;
                        
                        const segLen = Math.hypot(x2 - x1, y2 - y1);
                        const points = Math.max(1, Math.floor(segLen / 15)); // ~15px gap
                        
                        for(let p = 0; p < points; p++) {
                            const t = p / points;
                            const x = x1 + (x2 - x1) * t;
                            const y = y1 + (y2 - y1) * t;
                            
                            leds.push({
                                baseX: x,
                                baseY: y,
                                ring: ring,
                                seg: seg,
                                base: (ring % 3 === 0) ? 'yellow' : ((ring % 3 === 1) ? 'red' : 'green'),
                                active: 'white',
                                bright: 1
                            });
                        }
                    }
                }
            }

            const HUE = { green: 128, white: 0, red: 355, yellow: 52, blue: 200, cyan: 180 };
            const SAT = { green: 100, white: 0, red: 100, yellow: 100, blue: 100, cyan: 100 };
            const LIT = { green: 46, white: 95, red: 52, yellow: 57, blue: 55, cyan: 58 };

            function drawLED(x, y, col, bright) {
                if (bright < 0.05) return;
                const hue = HUE[col] || 128;
                const sat = SAT[col] || 100;
                const lit = LIT[col] || 50;

                const gr = 10 * bright;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, gr);
                grad.addColorStop(0, `hsla(${hue},${sat}%,${lit + 20}%,${bright})`);
                grad.addColorStop(0.3, `hsla(${hue},${sat}%,${lit}%,${bright * 0.5})`);
                grad.addColorStop(1, `hsla(${hue},${sat}%,${lit}%,0)`);
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, gr, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `hsla(${hue},${sat}%,90%,${Math.min(1, bright + 0.1)})`;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            function render() {
                frame++;
                ctx.clearRect(0, 0, LW, LH); // Transparent background

                const t = frame * SPEEDS[speedIdx];
                
                ctx.globalCompositeOperation = 'screen';

                leds.forEach(led => {
                    let b = 0.5;
                    let c = led.base;

                    const x = CX + led.baseX;
                    const y = CY + led.baseY;
                    
                    if (pattern === 0) b = Math.sin(t * 0.15 - led.ring * 0.5) * 0.5 + 0.5;
                    else if (pattern === 1) b = (led.ring === Math.floor(t) % 16) ? 1 : 0.2;
                    else if (pattern === 2) b = Math.sin(t * 0.2) * 0.5 + 0.5;
                    else if (pattern === 3) {
                        c = ['red','yellow','green','cyan','blue'][(led.ring + Math.floor(t*0.5)) % 5];
                        b = 0.9;
                    }
                    
                    drawLED(x, y, c, b);
                });

                requestAnimationFrame(render);
            }

            window.setPattern = (p, btn) => {
                pattern = p;
                document.querySelectorAll('[data-pat]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };

            window.cycleSpeed = () => {
                speedIdx = (speedIdx + 1) % SPEEDS.length;
                document.getElementById('spd-lbl').textContent = SPEED_LABELS[speedIdx];
            };

            window.addEventListener('resize', initLayout);
            initLayout();
            render();
        })();
    </script>
</body>

</html>
